# **The real-container tests run in the light tier only when a file they test changed.**
# Each entry is the patterns of the files its tests are about, beside the test files that
# start a Docker container. A test file the import graph selected is left out of the light
# tier unless a changed file matches one of its entry's patterns or is that test file
# itself. A pattern names what the test is about rather than everything it imports: any
# engine edit reaches these files through the graph, and they cost about half of a full
# suite's time. The full tier never reads this table, and a file left out here is never
# recorded as proven, so GitHub runs it. A test file that probes `docker info`, itself or
# through a support module, with no entry fails `verify-light.test.ts`.
