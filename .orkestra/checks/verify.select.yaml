# The light tier's selection tables, read by `verify.sh` through the stage runner's
# `--select`. Not a check: the loader reads only `*.sh` here. A pattern is a path from the
# checkout root where `*` is any run of characters, `/` included.

# Files a test reads off disk, runs, or spawns rather than imports, which vitest's import
# graph never holds, each pattern beside the files that read it: a change to one is taken
# as a change to its readers, so a reader that is a test runs, and so does every test
# importing a reader that is a module. Every row a changed file matches counts. **Kept by
# hand, and nothing fails when it drifts**: a test that starts reading another committed
# file by its path belongs here, or a change to that file runs nothing.
#
# **A `.ts` file a test starts as a child process is a `run:` row**, and its readers run
# when the entry changes or when anything it imports does: what the child imports is
# outside vitest's graph too, so the stage runner lists it with esbuild. A test that starts
# one with no `run:` row fails `verify-light.test.ts`, which finds them by how they are named.
reads:
  # Every template: read by name through `loadTemplates`, rendered off disk by two tests,
  # every file checked by `step-output.test.ts`, and bundled by `build.ts`.
  "src/prompts/templates/*": [
    src/prompts/adapters/builtin.ts, src/workflow/domain/prompt.test.ts,
    src/workflow/domain/goal.test.ts, src/workflow/domain/outputs/step-output.test.ts,
    test/e2e/build.test.ts
  ]
  # The shipped fleet: the modules that load it, the tests that load or run its files,
  # and the client's glyph test, which reads every agent's `icon:`.
  "src/library/shipped/*": [
    src/app/layers.ts, src/app/proofs.ts, src/workflow/domain/prompt.test.ts, test/e2e/open-pr.test.ts, test/e2e/proofs.test.ts,
    test/support/fingerprints.ts, test/e2e/library-from-disk.test.ts,
    test/e2e/committed-config.test.ts, test/e2e/build.test.ts, client/src/format/glyph.test.ts
  ]
  ".orkestra/agents/*": [client/src/format/glyph.test.ts]
  ".orkestra/checks/verify.sh": [
    test/verify-light.test.ts, test/support/verify-light.ts,
    test/contract/checks-shell.test.ts
  ]
  ".orkestra/checks/verify-light.sh": [test/support/verify-light.ts]
  ".orkestra/checks/verify.select.yaml": [test/verify-light.test.ts, test/support/verify-light.ts]
  ".agents/skills/jev/jev.mjs": [test/jev.test.ts]
  # Copied into a fixture project, or run nested under the recording hook.
  "client/vitest.config.ts": [test/e2e/fingerprints-carry.test.ts]
  "client/test-setup.ts": [test/e2e/fingerprints-carry.test.ts]
  "test/support/run-tmpdir.ts": [test/e2e/fingerprints-carry.test.ts]
  "test/e2e/library-from-disk.test.ts": [test/e2e/fingerprints-carry.test.ts]
  # Read as text, never imported.
  "src/ork.ts": [src/ork.test.ts]
  # A package's `exports`, resolved by every import through its name.
  "package.json": [test/package-exports.test.ts]
  "client/package.json": [client/src/package-exports.test.ts]
  # Spawned entries, each with everything it imports.
  "run:src/sim.ts": [test/e2e/sim.test.ts]
  "run:src/main.ts": [test/e2e/sim.test.ts]
  "run:src/serve.ts": [test/e2e/boot-refusal.test.ts]
