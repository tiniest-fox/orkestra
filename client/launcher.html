<!doctype html>
<!-- The desktop shell's launch window — the recent projects, one press each. Built by
     the same `vite build` as `index.html` and loaded off disk by Electron rather than
     served, so its asset URLs are relative (see `vite.config.ts`) and there is no
     manifest, no icon and no viewport line: it is never a tab and never a phone. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A page loaded off disk has no server to send a policy, so it carries one. The
         one remote origin is the font stylesheet `styles.css` imports; inline styles are
         allowed because React sets `style=` on a few nodes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The page fills whatever holds it — the window here, a frame in a proof — so the
         footer stays pinned and the list is what scrolls. `h-screen` would be the
         viewport, which is the window only when nothing else is drawing one. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
    </style>
    <title>Orkestra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/launcher.tsx"></script>
  </body>
</html>
